<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Domain For Sale</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f10;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
      max-width: 700px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #cfcfcf;
      margin-bottom: 30px;
    }

    .contact {
      display: inline-block;
      font-size: 22px;
      color: #00ffcc;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 20px;
      border: 1px solid #00ffcc;
      border-radius: 8px;
      transition: 0.3s;
    }

    .contact:hover {
      background: #00ffcc;
      color: #000;
    }

    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>This Domain Is For Sale</h1>

    <p>
      This website is currently inactive.<br/>
      The domain is available for purchase.
    </p>

    <p>Contact the owner:</p>

    <a class="contact" href="tel:+8615628932779">
      +86 156 2893 2779
    </a>

    <div class="note">
      Serious inquiries only.
    </div>
  </div>
</body>
</html>
